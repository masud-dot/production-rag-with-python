name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: mypy src tests
      - run: python3 -m pytest -q
      - name: Corpus determinism
        run: |
          python3 data/generate_corpus.py | tee a.txt
          python3 data/generate_corpus.py | tee b.txt
          diff a.txt b.txt
